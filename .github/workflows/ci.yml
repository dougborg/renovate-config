name: CI

# Repository baseline (dougborg-dot-net docs/decisions/0001-repository-baseline.md).
# `check` is a required check in the `Protect main` ruleset
# (stacks/github/protection.ts); renaming it blocks every merge.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Renovate needs Node ^24.11.0.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate the presets
        run: >-
          npx --yes --package=renovate@44.97.4
          -- renovate-config-validator --strict --no-global
          default.json moon.json renovate.json
